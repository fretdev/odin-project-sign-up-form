<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <link rel="stylesheet" href="css-reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="img-container">
           <img src="images/background-img.jpg" alt="background-img" class="bg-img">
           <div class="logo-container">
             <img src="images/odin-lined.png" alt="odin-logo" class="odin-img">
             <span>ODIN</span>
           </div>
           <p class="credit-txt">Photo by Halie West on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Unsplash</a></p>
        </div>
        <div class="form-container">
            <div class="form-description">
                <p>This is  not a real online service! You know you ned something like this in your life to help you realize your deepest dreams . Sign up now to get started.</p>
               <p>You know you want to.</p>
            </div>
            <form action="">
                <p>Let's do this!</p>
                <div class="form-inputs">
                    <div class="form-left">
                    <div class="label-input">
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" name="first-name" id="first-name">
                    </div>
                    <div class="label-input">
                        <label for="email">EMAIL</label>
                        <input type="email" name="email" id="email">
                    </div>
                    <div class="label-input">
                        <label for="password">PASSWORD</label>
                        <input type="password" name="password" id="password">
                    </div>
                </div>
                <div class="form-right">
                    <div class="label-input">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" name="last-name" id="last-name">
                    </div>
                    <div class="label-input">
                        <label for="phone-number">PHONE NUMBER</label>
                        <input type="text" name="phone-number" id="phone-number">
                    </div>
                    <div class="label-input">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm-password" id="confirm-password">
                    </div>
                </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
