<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <link rel="stylesheet" href="css-reset.css">
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
</head>
<body>
    <div class="container">
        <div class="img-container">
           <img src="images/background-img.jpg" alt="background-img" class="bg-img">
           <div class="logo-container">
             <img src="images/odin-lined.png" alt="odin-logo" class="odin-img">
             <span>ODIN</span>
           </div>
           <p class="credit-txt">Photo by Halie West on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Unsplash</a></p>
        </div>
        <div class="form-container">
            <div class="form-description">
                <p>This is  not a real online service! You know you ned something like this in your life to help you realize your deepest dreams . Sign up now to get started.</p>
               <p>You know you want to.</p>
            </div>
            <form action="">
               <div class="form-entries">
                    <p>Let's do this!</p>
                    <div class="form-inputs">
                        <div class="form-left">
                         <div class="label-input field-first-name">
                                <label for="first-name">FIRST NAME</label>
                                <input type="text" name="first-name" id="first-name" required>
                         </div>

                         <div class="label-input field-email">
                                <label for="email">EMAIL</label>
                                <input type="email" name="email" id="email" required>
                         </div>

                          <div class="label-input field-password">
                                <label for="password">PASSWORD</label>
                                <input type="password" name="password" id="password" 
                                required
                                minlength="8" maxlength="64" autocomplete="new-password">
                         </div>
                      </div>
                      
                       <div class="form-right">
                          <div class="label-input field-last-name">
                                <label for="last-name">LAST NAME</label>
                                <input type="text" name="last-name" id="last-name" required>
                          </div>

                          <div class="label-input field-phone-number">
                                <label for="phone-number">PHONE NUMBER</label>
                                <input type="text" name="phone-number" id="phone-number" required>
                          </div>

                          <div class="label-input field-confirm-password">
                                <label for="confirm-password">CONFIRM PASSWORD</label>
                                <input type="password" name="confirm-password" id="confirm-password" required>
                          </div>
                       </div>
                   </div>
               </div>
               <button>Create Account</button>
               <p class="login-txt">Already have an account? Log in</p>
            </form>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
